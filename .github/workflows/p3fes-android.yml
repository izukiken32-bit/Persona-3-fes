name: Build Persona 3 FES Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/p3fes-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - uses: android-actions/setup-android@v3
      - name: Test native EE core on host
        run: g++ -std=c++20 -Wall -Wextra -Werror app/src/main/cpp/ee_core.cpp app/src/main/cpp/ps2_elf_loader.cpp app/src/test/cpp/ee_core_test.cpp -Iapp/src/main/cpp -o /tmp/ee_core_test && /tmp/ee_core_test
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Persona-3-FES-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
